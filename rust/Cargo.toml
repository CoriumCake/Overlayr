[package]
name = "overlayr-core"
version = "0.1.0"
edition = "2024"
description = "Performance-oriented core for the Overlayr translation overlay"
license = "MIT"

[features]
default = []
native-capture = ["dep:xcap"]

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
reqwest = { version = "0.13.4", default-features = true, features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
single-instance = "0.3.3"
xcap = { version = "0.9.8", optional = true }

[lib]
name = "overlayr_core"
path = "src/lib.rs"

[[bin]]
name = "overlayr"
path = "src/main.rs"

[profile.release]
codegen-units = 1
debug = false
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
