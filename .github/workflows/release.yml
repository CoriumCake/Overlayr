name: Release

# Builds the desktop app for every platform and publishes it on overlayr.app.
# Push a tag matching the version in rust/Cargo.toml to release it:
#
#   git tag -a v0.2.0 -m "Release notes, one change per line"
#   git push origin v0.2.0
#
# The installers go to the overlayr-releases R2 bucket under v<version>/, and
# latest.json there makes overlayr.app/download serve them. Needs the
# CLOUDFLARE_API_TOKEN (with R2 edit access) and CLOUDFLARE_ACCOUNT_ID secrets.
#
# Signing runs once its secrets are added; until then the installers are
# unsigned, and Windows and macOS warn before opening them.
#
#   Windows (Authenticode): WINDOWS_CERTIFICATE (the .pfx, base64-encoded)
#     and WINDOWS_CERTIFICATE_PASSWORD.
#   macOS (Developer ID, then notarization): MACOS_CERTIFICATE (the
#     Developer ID Application .p12, base64-encoded),
#     MACOS_CERTIFICATE_PASSWORD, MACOS_SIGNING_IDENTITY ("Developer ID
#     Application: Name (TEAMID)"), APPLE_ID, APPLE_APP_PASSWORD (an
#     app-specific password from account.apple.com) and APPLE_TEAM_ID.

on:
  push:
    tags: ["v*"]
  # Test installers, kept as workflow artifacts and never published: from
  # the Actions tab, or on pull requests that change the packaging.
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"
      - "rust/src/bundle.rs"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches Cargo.toml
        id: version
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            # A test build: the version with the commit, e.g. 0.2.0-test.1a2b3c4.
            echo "version=$cargo_version-test.${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $cargo_version in rust/Cargo.toml"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

  linux:
    needs: version
    # The oldest supported runner, so the binary runs on older distributions.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux windowing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgl1-mesa-dev libwayland-dev libx11-dev libxcursor-dev \
            libxkbcommon-dev libxrandr-dev libxi-dev libxinerama-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # The portable build: grim/slurp capture and the Tesseract command, so
      # it doesn't depend on the build machine's Tesseract libraries.
      - name: Build
        working-directory: rust
        run: cargo build --release
      - name: Package
        run: |
          name="Overlayr-$VERSION-linux-x86_64"
          mkdir -p "dist/$name"
          cp rust/target/release/overlayr packaging/overlayr.desktop packaging/overlayr.svg \
            packaging/linux/install.sh "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Gates the signing steps.
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build
        working-directory: rust
        run: cargo build --release --features native-capture
      - name: Bundle Tesseract and the neural OCR engine
        shell: bash
        run: packaging/fetch-ocr.sh windows rust/target/release/ocr
      - name: Sign the programs
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "overlayr.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -Last 1
          $files = @("rust\target\release\overlayr.exe") +
            (Get-ChildItem rust\target\release\ocr -Recurse -Include *.exe, *.dll).FullName
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $files
          if ($LASTEXITCODE -ne 0) { throw "Signing failed" }
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          "PFX=$pfx" >> $env:GITHUB_ENV
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DVersion=$env:VERSION" "/DSource=$PWD\rust\target\release" packaging\windows\overlayr.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - name: Sign the installer
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          & $env:SIGNTOOL sign /f $env:PFX /p $env:WINDOWS_CERTIFICATE_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 (Get-ChildItem rust\target\windows\*.exe).FullName
          if ($LASTEXITCODE -ne 0) { throw "Signing failed" }
          Remove-Item $env:PFX
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: rust/target/windows/*.exe
          if-no-files-found: error

  # Tesseract for Intel Macs, built on one: Homebrew's Intel build with its
  # libraries. Packed with tar, which keeps the programs executable.
  macos-intel-ocr:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Gather Tesseract for Intel Macs
        run: |
          packaging/fetch-ocr.sh macos-intel ocr-x86_64
          tar -czf macos-intel-ocr.tgz ocr-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel-ocr
          path: macos-intel-ocr.tgz
          retention-days: 1
          if-no-files-found: error

  macos:
    needs: [version, macos-intel-ocr]
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Gates the signing steps.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install the icon renderer
        run: brew install librsvg
      - uses: actions/download-artifact@v4
        with:
          name: macos-intel-ocr
      - name: Add the Developer ID certificate
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          echo "$MACOS_CERTIFICATE" | base64 --decode >"$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          echo "OVERLAYR_SIGN_IDENTITY=$MACOS_SIGNING_IDENTITY" >>"$GITHUB_ENV"
      - name: Build Overlayr.app and the disk image
        run: |
          tar -xzf macos-intel-ocr.tgz
          OVERLAYR_INTEL_OCR="$PWD/ocr-x86_64" packaging/macos/build-app.sh
          mv rust/target/macos/Overlayr.dmg "rust/target/macos/Overlayr-$VERSION-macos.dmg"
      - name: Notarize the disk image
        if: env.OVERLAYR_SIGN_IDENTITY != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg="rust/target/macos/Overlayr-$VERSION-macos.dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: rust/target/macos/*.dmg
          if-no-files-found: error

  publish:
    needs: [version, linux, windows, macos]
    # Only tagged releases reach overlayr.app.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag's message holds the release notes.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Keep only the installers
        run: rm -f dist/macos-intel-ocr.tgz
      - name: Write latest.json
        run: |
          # Checkout leaves a lightweight copy of the tag, without its message.
          git fetch --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)' >notes.txt
          python3 - <<'EOF'
          import datetime, hashlib, json, os, pathlib
          version = os.environ["VERSION"]
          files = {}
          for path in sorted(pathlib.Path("dist").iterdir()):
              platform = ("windows" if path.name.endswith(".exe")
                          else "macos" if path.name.endswith(".dmg") else "linux")
              files[platform] = {
                  "name": path.name,
                  "size": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          # One change per line; a signature block, if any, isn't notes.
          notes = []
          for line in pathlib.Path("notes.txt").read_text().splitlines():
              if line.startswith("-----BEGIN"):
                  break
              line = line.strip().lstrip("-* ").strip()
              if line:
                  notes.append(line)
          release = {
              "version": version,
              "date": datetime.date.today().isoformat(),
              "notes": notes,
              "files": files,
          }
          pathlib.Path("latest.json").write_text(json.dumps(release, indent=2))
          print(json.dumps(release, indent=2))
          EOF
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The installers first, then latest.json, so the site never points at
      # files that aren't there yet.
      - name: Upload to overlayr.app
        run: |
          for file in dist/*; do
            npx --yes wrangler@4 r2 object put "overlayr-releases/v$VERSION/$(basename "$file")" \
              --file "$file" --content-type application/octet-stream --remote
          done
          npx --yes wrangler@4 r2 object put overlayr-releases/latest.json \
            --file latest.json --content-type application/json --remote
